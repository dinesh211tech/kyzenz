<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyzenz</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            color: #222;
            text-align: center;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <h1>Welcome to Kyzenz</h1>
</body>
</html>
