  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark:       #0a0a0a;
      --surface:    #111111;
      --border:     rgba(255,255,255,0.08);
      --text:       #ffffff;
      --text-muted: #94a3b8;
      --text-body:  #94a3b8;
      --text-subtle:#475569;
      --accent:     #0d9488;
      --teal:       #2dd4bf;
      --font:       'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --radius:     14px;
      --max-width:  1100px;
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--dark);
      background-image: radial-gradient(ellipse at 50% 0%, rgba(13,148,136,0.22) 0%, transparent 55%);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ── Nav ── */
    nav {
      padding: 14px 0;
      position: sticky;
      top: 0;
      background: transparent;
      border-bottom: 1px solid transparent;
      transition: background 0.3s, border-color 0.3s;
      z-index: 100;
    }
    nav.scrolled {
      background: rgba(10,10,10,0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    nav .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-back {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-subtle);
      transition: color 0.2s;
    }
    .nav-back::before { content: '← '; }
    .nav-back:hover   { color: var(--text); }
    .nav-title { font-size: 14px; font-weight: 600; color: var(--text-muted); }

    /* ── Page header ── */
    .page-header { padding: 72px 0 48px; }
    .page-eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 12px;
    }
    .page-header h1 {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }
    .page-meta { font-size: 13px; color: var(--text-subtle); }

    /* ── Policy content ── */
    .policy-wrap { padding: 0 0 80px; }
    .policy-block { margin-bottom: 36px; }
    .policy-block h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }
    .policy-block p,
    .policy-block li {
      font-size: 15px;
      color: var(--text-body);
      line-height: 1.8;
    }
    .policy-block ul { padding-left: 20px; margin-top: 8px; }
    .policy-block ul li { margin-bottom: 6px; }
    .policy-block a {
      color: var(--teal);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ── Footer ── */
    footer { border-top: 1px solid var(--border); padding: 24px 0; }
    footer .container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .footer-copy { font-size: 13px; color: var(--text-subtle); }
    .footer-link { font-size: 13px; color: var(--text-subtle); transition: color 0.2s; }
    .footer-link:hover { color: var(--text); }
  </style>
